name: Release installer

# Push a tag like v0.1.0 (or run this workflow by hand) to build productivity.larp-setup.exe
# and attach it to a GitHub Release, so nobody has to clone the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm test
      - run: dotnet test app/Larp.sln
      - run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: productivity.larp-setup
          path: dist/productivity.larp-setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/productivity.larp-setup.exe --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/productivity.larp-setup.exe --clobber
