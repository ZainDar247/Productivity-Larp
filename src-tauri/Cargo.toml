[package]
name = "productivity-larp"
version = "0.1.0"
edition = "2021"
description = "productivity.larp — global radial menu launcher"

[lib]
name = "productivity_larp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
larp-core = { path = "../crates/larp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
